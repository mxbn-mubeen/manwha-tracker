name: Sync manhwa websites

# Runs the website-adapter sync every 30 minutes. Talks directly to Neon via
# DATABASE_URL — no deployed/public API required. Telegram sources are NOT
# touched here; those are handled live by the telegram-download-watcher
# process, which needs to run continuously somewhere (not a fit for a
# 30-minute cron), see .agents/brain/roadmap.md.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sequential per-source sync allows up to 70s for FlareSolverr to wake plus
    # 60s per website source. 10 minutes was too tight for a library with more
    # than ~9 sources hitting worst-case timeouts in one run — when this job
    # got killed by the timeout mid-sync, the sys_is_syncing DB lock never got
    # released (it's only cleared in a `finally` block that a hard kill skips),
    # leaving the site's Sync button stuck showing "Syncing..." until something
    # else completed a run. See apps/worker/src/modules/sync/sync.service.ts's
    # stale-lock self-heal, added alongside this, for the other half of the fix.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter worker

      - name: Run sync
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run cron:sync
