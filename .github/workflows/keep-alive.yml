name: Keep Alive Render API

on:
  schedule:
    # Run every 10 minutes to prevent the 15-minute Render inactivity sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        env:
          RENDER_API_URL: "https://manwha-tracker-api.onrender.com"
        run: |
          # Replace with your actual Render URL when you deploy
          curl -sSf "${RENDER_API_URL}/health" > /dev/null
          echo "Successfully pinged the API to keep it awake!"
