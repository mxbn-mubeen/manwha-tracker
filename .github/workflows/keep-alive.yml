name: Keep Worker Alive

on:
  schedule:
    # Every 10 minutes — Render free tier sleeps after 15 min of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Worker Health (Render)
        env:
          WORKER_URL: "https://manhwa-tracker-worker.onrender.com"
        run: |
          # Keeps the Render worker awake so the Telegram watcher stays running
          # and sync.run doesn't cold-start from zero.
          # Vercel (API + frontend) is serverless — no keep-alive needed there.
          curl -sSf "${WORKER_URL}/health" > /dev/null
          echo "✅ Worker pinged successfully"
